server {
    listen 8081 ssl;
    listen [::]:8081 ssl;
    server_name dark-soft-chocolate.chickenkiller.com;
    ssl_certificate /etc/letsencrypt/live/dark-soft-chocolate.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dark-soft-chocolate.chickenkiller.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
server {
    listen 8180 ssl;
    listen [::]:8180 ssl;
    server_name dark-soft-chocolate.chickenkiller.com;
    ssl_certificate /etc/letsencrypt/live/dark-soft-chocolate.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dark-soft-chocolate.chickenkiller.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
